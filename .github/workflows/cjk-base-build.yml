name: Update CJK Base Fonts

on:
  push:
    branches:
      - v8
    paths:
      - "source/cjk/*/static-*.sha256"
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale to rebuild"
        required: true
        default: all
        type: choice
        options:
          - all
          - cn
          - tc
          - jp
          - kr

permissions:
  contents: write

concurrency:
  group: cjk-base-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
          fetch-depth: 0
      - id: plan
        name: Choose locale matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_LOCALE: ${{ inputs.locale }}
        run: |
          set -euo pipefail
          locales=()
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git ls-files 'source/cjk/*/static-*.sha256')"
            else
              changed_files="$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")"
            fi
            for locale in cn jp tc kr; do
              path="source/cjk/$locale/static-$locale.sha256"
              if grep -Fqx "$path" <<< "$changed_files"; then
                locales+=("$locale")
              fi
            done
          else
            case "$MANUAL_LOCALE" in
              all) locales=(cn jp tc kr) ;;
              cn|jp|tc|kr) locales=("$MANUAL_LOCALE") ;;
              *) echo "Unsupported locale: $MANUAL_LOCALE" >&2; exit 1 ;;
            esac
          fi
          matrix="$(printf '%s\n' "${locales[@]}" | jq -Rsc \
            'split("\n") | map(select(length > 0)) | {include: map({locale: .})}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "${#locales[@]}" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - name: Build and validate CJK base
        env:
          LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          hash_file="source/cjk/$LOCALE/static-$LOCALE.sha256"
          archive="source/cjk/$LOCALE/${LOCALE}-base-static.zip"
          expected_hash="$(tr -d '[:space:]' < "$hash_file")"
          expected_hash_file="$RUNNER_TEMP/static-$LOCALE.sha256"
          printf '%s\n' "$expected_hash" > "$expected_hash_file"
          uv run task.py cjk --preset "$LOCALE"
          test "$(tr -d '[:space:]' < "$hash_file")" = "$expected_hash"
          git diff --exit-code -- "$hash_file"
          test -f "$archive"
          ARCHIVE="$archive" HASH_FILE="$expected_hash_file" uv run python -c '
          import os
          from pathlib import Path
          from scripts.cjk.cache import verify_static_archive
          verify_static_archive(Path(os.environ["ARCHIVE"]), Path(os.environ["HASH_FILE"]))
          '
          mkdir -p cjk-base-artifacts
          cp "$archive" "cjk-base-artifacts/${LOCALE}-base-static.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cjk-base-${{ matrix.locale }}
          path: cjk-base-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      LOCALES_JSON: ${{ needs.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - uses: actions/download-artifact@v4
        with:
          pattern: cjk-base-*
          path: cjk-base-artifacts
          merge-multiple: true
      - name: Validate built ZIP artifacts
        run: |
          set -euo pipefail
          while IFS= read -r locale; do
            archive="cjk-base-artifacts/${locale}-base-static.zip"
            hash_file="source/cjk/$locale/static-$locale.sha256"
            test -f "$archive"
            ARCHIVE="$archive" HASH_FILE="$hash_file" uv run python -c '
            import os
            from pathlib import Path
            from scripts.cjk.cache import verify_static_archive
            verify_static_archive(Path(os.environ["ARCHIVE"]), Path(os.environ["HASH_FILE"]))
            '
          done < <(jq -r '.include[].locale' <<< "$LOCALES_JSON")
      - name: Render release notes
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/cjk-base
        run: |
          UPDATE_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          sed \
            -e "s|https://<url>|$RELEASE_URL|g" \
            -e "s|<time>|$UPDATE_TIME|g" \
            .github/cjk_base_template.md > cjk-base-notes.md
      - name: Replace CJK base release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t locales < <(jq -r '.include[].locale' <<< "$LOCALES_JSON")
          upload_args=()
          for locale in "${locales[@]}"; do
            upload_args+=("cjk-base-artifacts/${locale}-base-static.zip")
          done
          if gh release view cjk-base --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets="$(gh release view cjk-base --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for locale in cn tc jp kr; do
              grep -Fxq "${locale}-base-static.zip" <<< "$assets"
            done
            while IFS= read -r asset; do
              case "$asset" in
                cn-base-static.zip|tc-base-static.zip|jp-base-static.zip|kr-base-static.zip)
                  ;;
                *)
                  gh release delete-asset cjk-base "$asset" \
                    --repo "$GITHUB_REPOSITORY" --yes
                  ;;
              esac
            done <<< "$assets"
            for locale in "${locales[@]}"; do
              asset="${locale}-base-static.zip"
              gh release delete-asset cjk-base "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release upload cjk-base \
              --repo "$GITHUB_REPOSITORY" \
              "${upload_args[@]}"
            gh release edit cjk-base \
              --repo "$GITHUB_REPOSITORY" \
              --title "CJK Base Fonts" \
              --notes-file cjk-base-notes.md
          else
            test "${#locales[@]}" -eq 4
            gh release create cjk-base \
              --repo "$GITHUB_REPOSITORY" \
              --target "$DEFAULT_BRANCH" \
              --title "CJK Base Fonts" \
              --notes-file cjk-base-notes.md \
              "${upload_args[@]}"
          fi
      - name: Validate published ZIP assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p cjk-base-remote
          while IFS= read -r locale; do
            archive="cjk-base-remote/${locale}/${locale}-base-static.zip"
            mkdir -p "$(dirname "$archive")"
            gh release download cjk-base \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${locale}-base-static.zip" \
              --dir "$(dirname "$archive")" \
              --clobber
            ARCHIVE="$archive" HASH_FILE="source/cjk/$locale/static-$locale.sha256" uv run python -c '
            import os
            from pathlib import Path
            from scripts.cjk.cache import verify_static_archive
            verify_static_archive(Path(os.environ["ARCHIVE"]), Path(os.environ["HASH_FILE"]))
            '
          done < <(jq -r '.include[].locale' <<< "$LOCALES_JSON")
          assets="$(gh release view cjk-base --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for locale in cn tc jp kr; do
            grep -Fxq "${locale}-base-static.zip" <<< "$assets"
          done
