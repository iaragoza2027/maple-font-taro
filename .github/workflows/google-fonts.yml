name: Google Fonts QA

on:
  push:
    branches: [variable]
    paths:
      - "sources/**"
      - "!sources/cjk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/google-fonts.yml"
  pull_request:
    paths:
      - "sources/**"
      - "!sources/cjk/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/google-fonts.yml"

permissions:
  contents: read

jobs:
  google-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build and run Google Fonts QA
        run: uv run task.py googlefonts --qa
      - name: Publish Google Fonts QA report
        if: always()
        run: test ! -f fonts/report.md || cat fonts/report.md >> "$GITHUB_STEP_SUMMARY"
