name: Build All Formats and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.matrix.outputs.base }}
      cjk: ${{ steps.matrix.outputs.cjk }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - id: matrix
      name: Generate release task matrices
      run: |
        echo "base=$(uv run task.py publish matrix base)" >> "$GITHUB_OUTPUT"
        echo "cjk=$(uv run task.py publish matrix cjk)" >> "$GITHUB_OUTPUT"

  build-base:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.base) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - name: Build release task
      run: uv run task.py publish build "${{ matrix.task }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.task }}
        path: release-task/*.zip
        if-no-files-found: error

  build-cjk:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.cjk) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - name: Build release task
      run: uv run task.py publish build "${{ matrix.task }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.task }}
        path: release-task/*.zip
        if-no-files-found: error

  create-release:
    needs: [build-base, build-cjk]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true
    - name: Release artifacts
      run: uv run task.py publish release --tag "$RELEASE_TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
