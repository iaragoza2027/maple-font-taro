name: Build All Formats and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.matrix.outputs.base }}
      cjk: ${{ steps.matrix.outputs.cjk }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        prune-cache: false
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - name: Verify CJK base release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        assets="$(gh release view cjk-base --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
        for locale in cn tc jp kr; do
          expected="${locale}-base-static.zip"
          grep -Fxq "$expected" <<< "$assets"
        done
        mkdir -p cjk-base-state
        gh release download cjk-base \
          --repo "$GITHUB_REPOSITORY" \
          --pattern cjk-base-manifest.json \
          --dir cjk-base-state
        for locale in cn tc jp kr; do
          expected="$(tr -d '[:space:]' < "source/cjk/$locale/static-$locale.sha256")"
          actual="$(jq -r ".locales.$locale.static_sha256" cjk-base-state/cjk-base-manifest.json)"
          test "$expected" = "$actual"
        done
    - id: matrix
      name: Generate release task matrices
      run: |
        echo "base=$(uv run task.py publish matrix base)" >> "$GITHUB_OUTPUT"
        echo "cjk=$(uv run task.py publish matrix cjk)" >> "$GITHUB_OUTPUT"

  build-base:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.base) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        prune-cache: false
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - name: Build release task
      run: uv run task.py publish build "${{ matrix.task }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.task }}
        path: release-task/*.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  build-cjk:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.cjk) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        prune-cache: false
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - name: Build release task
      run: uv run task.py publish build "${{ matrix.task }}"
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.task }}
        path: release-task/*.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

  create-release:
    needs: [build-base, build-cjk]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        prune-cache: false
        python-version: '3.12'
    - run: uv sync --locked --no-dev
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release
        merge-multiple: true
    - name: Release artifacts
      run: uv run task.py publish release --tag "$RELEASE_TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
