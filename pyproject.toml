[project]
name = "maple-font"
version = "7.9"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fontmake~=3.12",
    "fonttools[woff]~=4.63",
    "glyphsLib~=6.13",
    "py7zr~=1.1",
    "python-minifier~=3.2",
    "skia-pathops~=0.9",
    "ttfautohint-py~=0.6",
]

[dependency-groups]
dev = [
    "pyrefly==1.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["maple-font-page", "FontPatcher"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fontTools.ttLib.TTFont" = { msg = "Use scripts.font_ops.fonttools.TTFont instead." }
"fontTools.varLib.TTFont" = { msg = "Use scripts.font_ops.fonttools.TTFont instead." }
"fontTools.varLib.instancer.instantiateVariableFont" = { msg = "Use scripts.font_ops.fonttools.instantiate_variable_font instead." }

[tool.ruff.lint.per-file-ignores]
# The wrapper owns the one raw FontTools import; the browser script is generated standalone.
"scripts/font_ops/fonttools.py" = ["TID251"]
"scripts/in_browser.py" = ["TID251"]

[tool.pyrefly]
project-includes = ["scripts/**/*.py", "build.py", "task.py"]
project-excludes = ["maple-font-page/**", "FontPatcher/**"]
python-version = "3.10"
